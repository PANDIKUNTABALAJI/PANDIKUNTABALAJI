<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 66" width="800" height="66" role="img" aria-label="About Me">
<style>.t{font:800 30px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#16163a}@media (prefers-color-scheme:dark){.t{fill:#eceeff}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#ff7a59"/></linearGradient></defs>
<rect x="0" y="10" width="8" height="0" rx="4" fill="url(#g)"><animate attributeName="height" from="0" to="36" dur=".5s" fill="freeze"/></rect>
<text x="24" y="40" class="t" opacity="0">👨‍💻  About Me<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.15s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.8s" begin="0.15s" fill="freeze"/></text>
<rect x="24" y="54" width="752" height="2" fill="#7c5cff" opacity=".18"/>
<rect x="24" y="52" width="0" height="5" rx="2.5" fill="url(#g)"><animate attributeName="width" from="0" to="190" dur=".9s" begin=".3s" fill="freeze"/></rect>
</svg>